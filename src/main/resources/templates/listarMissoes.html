<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>Lista de missoes</title>
</head>
<body>
<h1>Tabela de Missoes</h1>
<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Nome</th>
        <th>Dificuldade</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each ="ninja: ${ninjas}">
        <td> <img th:src="${ninja.imgUrl}"> </td>
        <td th:text="${ninja.id}"></td>
        <td th:text="${ninja.nome}"></td>
        <td th:text="${ninja.idade}"></td>
        <td th:text="${ninja.rank}"></td>
        <td th:text="${ninja.email}"></td>
        <td th:text="${ninja.missoes}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
