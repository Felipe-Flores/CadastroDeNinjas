<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adicionar Ninja - Shinobi System</title>
    <style>
        /* Variáveis de Cores Unificadas */
        :root {
            --primary: #2c3e50;
            --secondary: #95a5a6;
            --danger: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
            --info: #3498db;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 24px;
        }

        /* Estilização do Formulário */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }

        input {
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--info);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        }

        /* Botão de Submissão */
        .btn-submit {
            background-color: var(--success);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #219150;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        /* Link de Voltar */
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Mensagens de Sucesso/Erro */
        .mensagem {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Novo Ninja</h1>

    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>

    <form th:action="@{/ninjas/ui/salvar}" th:object="${ninja}" method="post">

        <label for="nome">Nome do Ninja:</label>
        <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Naruto Uzumaki" required/>

        <label for="email">Email de Contato:</label>
        <input type="email" id="email" th:field="*{email}" placeholder="ninja@folha.com" required/>

        <label for="imgUrl">URL do Avatar (Link):</label>
        <input type="text" id="imgUrl" th:field="*{imgUrl}" placeholder="http://..." required/>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" th:field="*{idade}" min="5" max="150" required/>

        <label for="rank">Rank Atual:</label>
        <input type="text" id="rank" th:field="*{rank}" placeholder="Genin, Chunin, Jounin..." required/>

        <button type="submit" class="btn-submit">Cadastrar Ninja</button>
    </form>

    <a th:href="@{/ninjas/ui/listar}" class="btn-back">← Voltar para a lista</a>
</div>

</body>
</html>
